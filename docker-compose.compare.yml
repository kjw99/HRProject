services:
  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file:
      - ./back/.env
    environment:
      METRICS_BRANCH: develop
      CORS_ORIGINS: http://localhost:3001,http://localhost:8081,http://127.0.0.1:3001,http://127.0.0.1:8081
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8001:8000"
    volumes:
      - ./back:/app
      - back_venv:/app/.venv
    command: uv run uvicorn app.instrumented_main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  celery_worker:
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file:
      - ./back/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./back:/app
      - back_venv:/app/.venv
    command: uv run celery -A app.core.celery_app:celery_app worker --loglevel=info
    depends_on:
      - redis

  celery_beat:
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file:
      - ./back/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./back:/app
      - back_venv:/app/.venv
    command: uv run celery -A app.core.celery_app:celery_app beat --loglevel=info
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    env_file:
      - ./front/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_API_URL_DEV: http://localhost:8001
      BACKEND_URL: http://back:8000
      NEXTAUTH_BACKEND_URL: http://back:8000
    ports:
      - "3001:3000"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - back

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - back

volumes:
  back_venv:
